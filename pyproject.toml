[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "idofig"
version = "0.9.0"
description = "Reproducible, editable publication figures: code draws, a small spec composes, a canvas or an agent refines."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ido Haber" }]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
idofig = "idofig.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/idofig"]

[tool.hatch.build.targets.sdist]
include = ["src/idofig", "tests", "docs", "README.md", "LICENSE", "SPEC.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
